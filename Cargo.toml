[package]
name = "nahrung2sqlite"
version = "0.2.0"
edition = "2021"

[dependencies]
calamine = "0.26"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "charset", "http2"] }
serde_json = "1.0"
